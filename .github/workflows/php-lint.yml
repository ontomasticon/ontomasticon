name: PHP lint

# Runs on every push to any branch (checking the newest commit pushed) and on pull requests
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version, and recent 8.x releases
        php: ['7.3', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check syntax of all PHP files
        run: |
          failed=0
          while IFS= read -r f; do
            if ! output=$(php -l "$f" 2>&1); then
              echo "$output"
              failed=1
            fi
          done < <(git ls-files '*.php')
          exit $failed
